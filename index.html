  /* ---------- Section framing ---------- */
  section { margin-bottom: 0; }

  .compare-card:hover { transform: translateY(-4px); filter: drop-shadow(0 10px 24px rgba(255,0,68,0.28)); }

  .compare-card .hex-panel-inner { padding: 24px; overflow: hidden; position: relative; }

  .compare-icon {

  /* ---------- Synthesis ---------- */
  .synthesis { --cut: 20px; }
  .synthesis .hex-panel-inner { padding: 26px 28px; }
  .synthesis p { margin: 0; font-size: 15px; color: var(--text-secondary); }
  .synthesis p + p { margin-top: 12px; }

  /* ---------- Ripple ---------- */
  .ripple-wrap { position: relative; overflow: hidden; }

&lt;section class=&quot;snap-section&quot; id=&quot;panel-header&quot;&gt;

          &lt;h1 class=&quot;student-name&quot;&gt;Gimbert Ludovice&lt;/h1&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;p class=&quot;task-title&quot;&gt;Task 2 — UI/UX &amp;amp; Material Design&lt;/p&gt;
      &lt;div class=&quot;meta-grid&quot;&gt;
        &lt;div class=&quot;meta-item&quot;&gt;
          &lt;span class=&quot;meta-label&quot;&gt;Year &amp;amp; Section&lt;/span&gt;

        &lt;/div&gt;
        &lt;div class=&quot;meta-item&quot;&gt;
          &lt;span class=&quot;meta-label&quot;&gt;Degree Program&lt;/span&gt;
          &lt;span class=&quot;meta-value&quot;&gt;BSIT Mobile &amp;amp; Web Dev&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;meta-item&quot;&gt;
          &lt;span class=&quot;meta-label&quot;&gt;Professor&lt;/span&gt;
          &lt;span class=&quot;meta-value&quot;&gt;John Kyle Martin&lt;/span&gt;
        &lt;/div&gt;

&lt;/section&gt;

  &lt;main&gt;

    &lt;section class=&quot;snap-section&quot; id=&quot;ui-vs-ux&quot;&gt;
      &lt;div class=&quot;section-heading&quot;&gt;
        &lt;span class=&quot;section-number&quot;&gt;1&lt;/span&gt;
        &lt;h2&gt;Understanding UI vs. UX&lt;/h2&gt;
      &lt;/div&gt;
      &lt;p class=&quot;section-intro&quot;&gt;
        Although the two terms are often used interchangeably, User Interface (UI) and User
        Experience (UX) describe two different layers of a digital product — one is about
        &lt;em&gt;what the user perceives&lt;/em&gt;, and the other is about &lt;em&gt;what the user feels&lt;/em&gt;.
      &lt;/p&gt;

      &lt;article class=&quot;compare-grid&quot;&gt;
        &lt;div class=&quot;compare-card hex-panel ripple-wrap&quot;&gt;
          &lt;div class=&quot;hex-panel-inner&quot;&gt;
            &lt;div class=&quot;compare-icon&quot;&gt;UI&lt;/div&gt;
            &lt;h3&gt;User Interface&lt;/h3&gt;
            &lt;p class=&quot;subtitle&quot;&gt;The surface the user sees and touches&lt;/p&gt;
            &lt;p&gt;
              UI is the visual and tactile layer of an application — the buttons, colors,
              layout, icons, and typography a user directly interacts with on screen.
            &lt;/p&gt;
            &lt;ul&gt;
              &lt;li&gt;Visual appearance and branding&lt;/li&gt;
              &lt;li&gt;Layout, spacing, and typography&lt;/li&gt;
              &lt;li&gt;Buttons, icons, and controls&lt;/li&gt;
              &lt;li&gt;Color systems and imagery&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/div&gt;
        &lt;/div&gt;

        &lt;div class=&quot;compare-card ux hex-panel cyan-first ripple-wrap&quot;&gt;
          &lt;div class=&quot;hex-panel-inner&quot;&gt;
            &lt;div class=&quot;compare-icon&quot;&gt;UX&lt;/div&gt;
            &lt;h3&gt;User Experience&lt;/h3&gt;
            &lt;p class=&quot;subtitle&quot;&gt;How the user feels while using it&lt;/p&gt;
            &lt;p&gt;
              UX is the overall feeling and outcome of using an app — whether tasks are
              intuitive, fast to complete, and free of friction or confusion.
            &lt;/p&gt;
            &lt;ul&gt;
              &lt;li&gt;Ease of navigation and task flow&lt;/li&gt;
              &lt;li&gt;Speed and responsiveness of feedback&lt;/li&gt;
              &lt;li&gt;How intuitive an action feels&lt;/li&gt;
              &lt;li&gt;Overall satisfaction and trust&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/article&gt;

      &lt;div class=&quot;divider-callout hex-panel&quot;&gt;
        &lt;div class=&quot;hex-panel-inner&quot;&gt;
          &lt;strong&gt;The key distinction:&lt;/strong&gt; a screen can look great — a strong UI — but
          still be confusing to navigate, which is poor UX. Good design requires both:
          an interface that looks polished &lt;em&gt;and&lt;/em&gt; an experience that feels effortless.
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;snap-section&quot; id=&quot;material-design&quot;&gt;
      &lt;div class=&quot;section-heading&quot;&gt;
        &lt;span class=&quot;section-number&quot;&gt;2&lt;/span&gt;
        &lt;h2&gt;Material Design: Bridging UI and UX&lt;/h2&gt;
      &lt;/div&gt;
      &lt;p class=&quot;section-intro&quot;&gt;
        Material Design is Google&#x27;s design system for Android, and it strengthens both
        sides of this equation at once. It gives developers pre-tested visual guidelines
        that make interfaces consistent and polished (elevating the UI), while its
        interaction patterns make the app easier and more satisfying to actually use
        (elevating the UX).
      &lt;/p&gt;

      &lt;div class=&quot;md-columns&quot;&gt;
        &lt;div class=&quot;md-card visual hex-panel ripple-wrap&quot;&gt;
          &lt;div class=&quot;hex-panel-inner&quot;&gt;
            &lt;div class=&quot;md-card-head&quot;&gt;Elevating the UI&lt;/div&gt;
            &lt;div class=&quot;md-card-body&quot;&gt;
              &lt;div class=&quot;chip-row&quot;&gt;
                &lt;span class=&quot;chip&quot;&gt;SPACING&lt;/span&gt;
                &lt;span class=&quot;chip&quot;&gt;ELEVATION&lt;/span&gt;
                &lt;span class=&quot;chip&quot;&gt;COLOR SYS&lt;/span&gt;
              &lt;/div&gt;
              &lt;p&gt;
                Material Design supplies a shared visual language — an 8dp spacing grid,
                layered elevation with consistent shadows, and a structured color and
                typography system. Developers don&#x27;t have to invent these rules from
                scratch; they simply apply pre-tested guidelines, which keeps every
                screen in the app looking consistent and professionally polished.
              &lt;/p&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;

        &lt;div class=&quot;md-card interaction hex-panel cyan-first ripple-wrap&quot;&gt;
          &lt;div class=&quot;hex-panel-inner&quot;&gt;
            &lt;div class=&quot;md-card-head&quot;&gt;Elevating the UX&lt;/div&gt;
            &lt;div class=&quot;md-card-body&quot;&gt;
              &lt;div class=&quot;chip-row&quot;&gt;
                &lt;span class=&quot;chip&quot;&gt;RIPPLE FX&lt;/span&gt;
                &lt;span class=&quot;chip&quot;&gt;NAV FLOW&lt;/span&gt;
                &lt;span class=&quot;chip&quot;&gt;HIERARCHY&lt;/span&gt;
              &lt;/div&gt;
              &lt;p&gt;
                Beyond visuals, Material Design defines interaction patterns: predictable
                navigation structures (like the app bar and bottom navigation), instant
                feedback such as the ripple effect on taps, and a clear hierarchy that
                tells the user what to focus on next. These patterns reduce hesitation
                and confusion, making the app faster and more satisfying to use.
              &lt;/p&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;p class=&quot;hint&quot;&gt;Tap the cards above — that spreading glow IS the ripple effect being discussed.&lt;/p&gt;
    &lt;/section&gt;

    &lt;section class=&quot;snap-section&quot; id=&quot;synthesis&quot;&gt;
      &lt;div class=&quot;section-heading&quot;&gt;
        &lt;span class=&quot;section-number&quot;&gt;3&lt;/span&gt;
        &lt;h2&gt;Synthesis&lt;/h2&gt;
      &lt;/div&gt;
      &lt;div class=&quot;synthesis hex-panel&quot;&gt;
        &lt;div class=&quot;hex-panel-inner&quot;&gt;
          &lt;p&gt;
            UI and UX are not competing concerns — they are two dimensions of the same
            product. &lt;strong&gt;UI shapes what a user perceives&lt;/strong&gt;; &lt;strong&gt;UX shapes
            what a user accomplishes&lt;/strong&gt; and how that process feels.
          &lt;/p&gt;
          &lt;p&gt;
            Material Design matters precisely because it does not treat these dimensions
            separately. Its visual guidelines give developers a fast, consistent path to
            good UI, while its interaction patterns bake good UX directly into the
            components themselves — meaning a developer who simply follows the system is,
            by default, building an app that both looks good and works well.
          &lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;footer&gt;
        Submitted by Gimbert Ludovice · 2nd Year WITMWD3M1 · BSIT Mobile &amp;amp; Web Development · Prof. John Kyle Martin
      &lt;/footer&gt;
    &lt;/section&gt;

  &lt;/main&gt;

&lt;/div&gt;

  document.querySelectorAll(&#x27;.ripple-wrap&#x27;).forEach(function (el) {
    el.addEventListener(&#x27;click&#x27;, function (e) {
      var rect = el.getBoundingClientRect();
      var size = Math.max(rect.width, rect.height);
      var ripple = document.createElement(&#x27;span&#x27;);
      ripple.className = &#x27;ripple&#x27;;
      ripple.style.width = ripple.style.height = size + &#x27;px&#x27;;
      ripple.style.left = (e.clientX - rect.left - size / 2) + &#x27;px&#x27;;
      ripple.style.top = (e.clientY - rect.top - size / 2) + &#x27;px&#x27;;
      el.appendChild(ripple);
      setTimeout(function () { ripple.remove(); }, 700);
    });
  });
&lt;/script&gt;

  @keyframes scan{ 0%{transform:translateY(0);} 100%{transform:translateY(100vh);} }

  .wrap{ position:relative; z-index:2; max-width:1100px; margin:0 auto; padding:28px 20px 60px; }

  pre.code-block .c-str{ color:#9cffb0; }
  pre.code-block .c-attr{ color:#7fd8ff; }
  pre.code-block .c-cm{ color:#5c6180; font-style:italic; }
  pre.code-block .c-kw{ color:#ff6b9d; }

  .file-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }

  }

&lt;body&gt;
&lt;div class=&quot;scanline&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;wrap&quot;&gt;

  &lt;header class=&quot;hero&quot;&gt;
    &lt;div class=&quot;brand-row&quot;&gt;
      &lt;div class=&quot;rog-mark&quot;&gt;R&lt;/div&gt;
      &lt;div class=&quot;brand-text&quot;&gt;&lt;b&gt;REPUBLIC OF GAMERS&lt;/b&gt; // DEV LAB — TASK SUBMISSION&lt;/div&gt;
    &lt;/div&gt;
    &lt;h1 class=&quot;title&quot;&gt;Android Project Structure — Task 3&lt;/h1&gt;
    &lt;div class=&quot;subtitle&quot;&gt;Manifest &amp;middot; Source Files &amp;middot; Resources — anatomy of an Android Studio project, illustrated with the actual project files&lt;/div&gt;

    &lt;div class=&quot;info-grid&quot;&gt;
      &lt;div class=&quot;info-card&quot;&gt;&lt;div class=&quot;info-label&quot;&gt;Student&lt;/div&gt;&lt;div class=&quot;info-value&quot;&gt;Gimbert Ludovice&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;info-card&quot;&gt;&lt;div class=&quot;info-label&quot;&gt;Year &amp;amp; Section&lt;/div&gt;&lt;div class=&quot;info-value&quot;&gt;2nd Year — WITMWD3M1&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;info-card&quot;&gt;&lt;div class=&quot;info-label&quot;&gt;Degree Program&lt;/div&gt;&lt;div class=&quot;info-value&quot;&gt;BSIT — Mobile &amp;amp; Web Development&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;info-card&quot;&gt;&lt;div class=&quot;info-label&quot;&gt;Professor&lt;/div&gt;&lt;div class=&quot;info-value&quot;&gt;John Kyle Martin&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/header&gt;

  &lt;main&gt;

    &lt;!-- 01 HIERARCHY --&gt;
    &lt;section class=&quot;card&quot;&gt;
      &lt;div class=&quot;section-head&quot;&gt;
        &lt;div class=&quot;section-num&quot;&gt;01&lt;/div&gt;
        &lt;h2&gt;Overall Project Hierarchy&lt;/h2&gt;
        &lt;div class=&quot;points-tag&quot;&gt;Live Files&lt;/div&gt;
      &lt;/div&gt;
      &lt;p class=&quot;lead&quot;&gt;
        A standard Android project created in Android Studio follows a consistent directory layout.
        The physical path on disk is &lt;span class=&quot;kw&quot;&gt;app/src/main/&lt;/span&gt;, containing three key
        subfolders — &lt;span class=&quot;kw&quot;&gt;java/&lt;/span&gt; (or &lt;span class=&quot;kw&quot;&gt;kotlin/&lt;/span&gt;), &lt;span class=&quot;kw&quot;&gt;res/&lt;/span&gt;,
        and &lt;span class=&quot;kw&quot;&gt;AndroidManifest.xml&lt;/span&gt;. Android Studio&#x27;s &lt;em&gt;Android view&lt;/em&gt; displays these in a
        simplified, developer-friendly grouping, while the &lt;em&gt;Project view&lt;/em&gt; shows the true file-system hierarchy.
      &lt;/p&gt;
      &lt;div class=&quot;tree&quot;&gt;AppName/
└── app/
    ├── &lt;span class=&quot;fold&quot;&gt;manifests/&lt;/span&gt;
    │   └── &lt;span class=&quot;fil&quot;&gt;AndroidManifest.xml&lt;/span&gt;
    ├── &lt;span class=&quot;fold&quot;&gt;java/&lt;/span&gt; &lt;span class=&quot;cmt&quot;&gt;(or kotlin+java/)&lt;/span&gt;
    │   └── com.example.appname/
    │       ├── &lt;span class=&quot;fil&quot;&gt;MainActivity.java&lt;/span&gt; &lt;span class=&quot;cmt&quot;&gt;(or .kt)&lt;/span&gt;
    │       └── &lt;span class=&quot;cmt&quot;&gt;... (other classes)&lt;/span&gt;
    ├── &lt;span class=&quot;fold&quot;&gt;res/&lt;/span&gt;
    │   ├── &lt;span class=&quot;fold&quot;&gt;layout/&lt;/span&gt;
    │   ├── &lt;span class=&quot;fold&quot;&gt;drawable/&lt;/span&gt;
    │   ├── &lt;span class=&quot;fold&quot;&gt;values/&lt;/span&gt;
    │   ├── &lt;span class=&quot;fold&quot;&gt;mipmap/&lt;/span&gt;
    │   └── &lt;span class=&quot;cmt&quot;&gt;... (other resource types)&lt;/span&gt;
    └── &lt;span class=&quot;fil&quot;&gt;build.gradle&lt;/span&gt; &lt;span class=&quot;cmt&quot;&gt;(Module: app)&lt;/span&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- 02 MANIFEST --&gt;
    &lt;section class=&quot;card&quot;&gt;
      &lt;div class=&quot;section-head&quot;&gt;
        &lt;div class=&quot;section-num&quot;&gt;02&lt;/div&gt;
        &lt;h2&gt;The AndroidManifest.xml&lt;/h2&gt;
        &lt;div class=&quot;points-tag&quot;&gt;Live File&lt;/div&gt;
      &lt;/div&gt;
      &lt;p class=&quot;lead&quot;&gt;
        The &lt;span class=&quot;kw&quot;&gt;AndroidManifest.xml&lt;/span&gt; is the configuration blueprint of the entire application.
        It lives at &lt;span class=&quot;kw&quot;&gt;app/src/main/AndroidManifest.xml&lt;/span&gt;, and the Android system reads it
        before installing or running the app to understand what the app is and what it needs to function.
      &lt;/p&gt;
      &lt;div class=&quot;chip-list&quot;&gt;
        &lt;span class=&quot;chip&quot;&gt;App Metadata&lt;/span&gt;
        &lt;span class=&quot;chip&quot;&gt;Component Declaration&lt;/span&gt;
        &lt;span class=&quot;chip&quot;&gt;Permissions&lt;/span&gt;
        &lt;span class=&quot;chip&quot;&gt;Intent Filters&lt;/span&gt;
        &lt;span class=&quot;chip&quot;&gt;Hardware/SDK Requirements&lt;/span&gt;
      &lt;/div&gt;
      &lt;p class=&quot;lead&quot;&gt;
        In short, the manifest acts as the app&#x27;s &lt;strong&gt;identity card and permission form&lt;/strong&gt; — it tells
        the operating system what the app is, what it can access, and how it should behave when launched.
        Below is this project&#x27;s actual manifest, which registers &lt;span class=&quot;kw&quot;&gt;MainActivity&lt;/span&gt; as the
        launcher screen via the &lt;span class=&quot;kw&quot;&gt;MAIN&lt;/span&gt; and &lt;span class=&quot;kw&quot;&gt;LAUNCHER&lt;/span&gt; intent filters.
      &lt;/p&gt;
      &lt;div class=&quot;file-panel&quot;&gt;
        &lt;div class=&quot;file-path&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;app/src/main/AndroidManifest.xml&lt;/div&gt;
        &lt;pre class=&quot;code-block&quot;&gt;&lt;span class=&quot;c-cm&quot;&gt;&amp;lt;?xml version=&quot;1.0&quot; encoding=&quot;utf-8&quot;?&amp;gt;&lt;/span&gt;
&amp;lt;&lt;span class=&quot;c-tag&quot;&gt;manifest&lt;/span&gt; &lt;span class=&quot;c-attr&quot;&gt;xmlns:android&lt;/span&gt;=&lt;span class=&quot;c-str&quot;&gt;&quot;http://schemas.android.com/apk/res/android&quot;&lt;/span&gt;
    &lt;span class=&quot;c-attr&quot;&gt;package&lt;/span&gt;=&lt;span class=&quot;c-str&quot;&gt;&quot;com.example.simpleandroidapp&quot;&lt;/span&gt;&amp;gt;

    &amp;lt;&lt;span class=&quot;c-tag&quot;&gt;application&lt;/span&gt;
        &lt;span class=&quot;c-attr&quot;&gt;android:allowBackup&lt;/span&gt;=&lt;span class=&quot;c-str&quot;&gt;&quot;true&quot;&lt;/span&gt;
        &lt;span class=&quot;c-attr&quot;&gt;android:icon&lt;/span&gt;=&lt;span class=&quot;c-str&quot;&gt;&quot;@mipmap/ic_launcher&quot;&lt;/span&gt;
        &lt;span class=&quot;c-attr&quot;&gt;android:label&lt;/span&gt;=&lt;span class=&quot;c-str&quot;&gt;&quot;@string/app_name&quot;&lt;/span&gt;
        &lt;span class=&quot;c-attr&quot;&gt;android:theme&lt;/span&gt;=&lt;span class=&quot;c-str&quot;&gt;&quot;@style/AppTheme&quot;&lt;/span&gt;&amp;gt;

        &amp;lt;&lt;span class=&quot;c-tag&quot;&gt;activity&lt;/span&gt; &lt;span class=&quot;c-attr&quot;&gt;android:name&lt;/span&gt;=&lt;span class=&quot;c-str&quot;&gt;&quot;.MainActivity&quot;&lt;/span&gt;
            &lt;span class=&quot;c-attr&quot;&gt;android:exported&lt;/span&gt;=&lt;span class=&quot;c-str&quot;&gt;&quot;true&quot;&lt;/span&gt;&amp;gt;
            &amp;lt;&lt;span class=&quot;c-tag&quot;&gt;intent-filter&lt;/span&gt;&amp;gt;
                &amp;lt;&lt;span class=&quot;c-tag&quot;&gt;action&lt;/span&gt; &lt;span class=&quot;c-attr&quot;&gt;android:name&lt;/span&gt;=&lt;span class=&quot;c-str&quot;&gt;&quot;android.intent.action.MAIN&quot;&lt;/span&gt; /&amp;gt;
                &amp;lt;&lt;span class=&quot;c-tag&quot;&gt;category&lt;/span&gt; &lt;span class=&quot;c-attr&quot;&gt;android:name&lt;/span&gt;=&lt;span class=&quot;c-str&quot;&gt;&quot;android.intent.category.LAUNCHER&quot;&lt;/span&gt; /&amp;gt;
            &amp;lt;/&lt;span class=&quot;c-tag&quot;&gt;intent-filter&lt;/span&gt;&amp;gt;
        &amp;lt;/&lt;span class=&quot;c-tag&quot;&gt;activity&lt;/span&gt;&amp;gt;

    &amp;lt;/&lt;span class=&quot;c-tag&quot;&gt;application&lt;/span&gt;&amp;gt;

&amp;lt;/&lt;span class=&quot;c-tag&quot;&gt;manifest&lt;/span&gt;&amp;gt;&lt;/pre&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- 03 SOURCE FILES --&gt;
    &lt;section class=&quot;card&quot;&gt;
      &lt;div class=&quot;section-head&quot;&gt;
        &lt;div class=&quot;section-num&quot;&gt;03&lt;/div&gt;
        &lt;h2&gt;The Source Files&lt;/h2&gt;
        &lt;div class=&quot;points-tag&quot;&gt;Live File&lt;/div&gt;
      &lt;/div&gt;
      &lt;p class=&quot;lead&quot;&gt;
        Source files contain the actual program logic that makes the app functional, living under
        &lt;span class=&quot;kw&quot;&gt;app/src/main/java/&lt;/span&gt; (even for Kotlin projects, unless renamed to &lt;span class=&quot;kw&quot;&gt;kotlin/&lt;/span&gt;),
        organized under a package structure that mirrors the app&#x27;s domain name in reverse
        (e.g. &lt;span class=&quot;kw&quot;&gt;com.example.myapp&lt;/span&gt;).
      &lt;/p&gt;
      &lt;div class=&quot;chip-list&quot;&gt;
        &lt;span class=&quot;chip&quot;&gt;Activities&lt;/span&gt;
        &lt;span class=&quot;chip&quot;&gt;Fragments&lt;/span&gt;
        &lt;span class=&quot;chip&quot;&gt;Adapters&lt;/span&gt;
        &lt;span class=&quot;chip&quot;&gt;Model Classes&lt;/span&gt;
        &lt;span class=&quot;chip&quot;&gt;Utility / Helper Classes&lt;/span&gt;
      &lt;/div&gt;
      &lt;p class=&quot;lead&quot;&gt;
        If the manifest is the app&#x27;s &lt;strong&gt;identity&lt;/strong&gt;, the source files are its &lt;strong&gt;brain&lt;/strong&gt; —
        they handle event handling, business logic, and the data flow between the UI and the backend or local
        storage. Here&#x27;s this project&#x27;s &lt;span class=&quot;kw&quot;&gt;MainActivity.java&lt;/span&gt;, which links to
        &lt;span class=&quot;kw&quot;&gt;activity_main.xml&lt;/span&gt; and wires up a click listener:
      &lt;/p&gt;
      &lt;div class=&quot;file-panel&quot;&gt;
        &lt;div class=&quot;file-path&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;app/src/main/java/com.example.simpleandroidapp/MainActivity.java&lt;/div&gt;
        &lt;pre class=&quot;code-block&quot;&gt;&lt;span class=&quot;c-kw&quot;&gt;package&lt;/span&gt; com.example.simpleandroidapp;

&lt;span class=&quot;c-kw&quot;&gt;import&lt;/span&gt; android.os.Bundle;
&lt;span class=&quot;c-kw&quot;&gt;import&lt;/span&gt; android.widget.Button;
&lt;span class=&quot;c-kw&quot;&gt;import&lt;/span&gt; android.widget.TextView;
&lt;span class=&quot;c-kw&quot;&gt;import&lt;/span&gt; androidx.appcompat.app.AppCompatActivity;

&lt;span class=&quot;c-cm&quot;&gt;/**
 * MainActivity - the entry point screen of the app.
 * Demonstrates how source files handle UI logic and events.
 */&lt;/span&gt;
&lt;span class=&quot;c-kw&quot;&gt;public&lt;/span&gt; &lt;span class=&quot;c-kw&quot;&gt;class&lt;/span&gt; MainActivity &lt;span class=&quot;c-kw&quot;&gt;extends&lt;/span&gt; AppCompatActivity {

    &lt;span class=&quot;c-kw&quot;&gt;private&lt;/span&gt; TextView textViewMessage;
    &lt;span class=&quot;c-kw&quot;&gt;private&lt;/span&gt; Button buttonClickMe;

    &lt;span class=&quot;c-fn&quot;&gt;@Override&lt;/span&gt;
    &lt;span class=&quot;c-kw&quot;&gt;protected&lt;/span&gt; &lt;span class=&quot;c-kw&quot;&gt;void&lt;/span&gt; onCreate(Bundle savedInstanceState) {
        &lt;span class=&quot;c-kw&quot;&gt;super&lt;/span&gt;.onCreate(savedInstanceState);
        &lt;span class=&quot;c-cm&quot;&gt;// Connects this Activity to its layout resource file&lt;/span&gt;
        setContentView(R.layout.activity_main);

        &lt;span class=&quot;c-cm&quot;&gt;// Link Java variables to XML views by their IDs&lt;/span&gt;
        textViewMessage = findViewById(R.id.textViewMessage);
        buttonClickMe = findViewById(R.id.buttonClickMe);

        &lt;span class=&quot;c-cm&quot;&gt;// Event handling: update the TextView when the button is clicked&lt;/span&gt;
        buttonClickMe.setOnClickListener(v -&amp;gt;
                textViewMessage.setText(getString(R.string.button_clicked_message))
        );
    }
}&lt;/pre&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- 04 RESOURCES --&gt;
    &lt;section class=&quot;card&quot;&gt;
      &lt;div class=&quot;section-head&quot;&gt;
        &lt;div class=&quot;section-num&quot;&gt;04&lt;/div&gt;
        &lt;h2&gt;The Resource (res) Files&lt;/h2&gt;
        &lt;div class=&quot;points-tag&quot;&gt;4 Live Files&lt;/div&gt;
      &lt;/div&gt;
      &lt;p class=&quot;lead&quot;&gt;
        The &lt;span class=&quot;kw&quot;&gt;res/&lt;/span&gt; folder contains all non-code assets — anything that defines the app&#x27;s
        appearance, text, and static assets, separate from the logic. This decoupling of UI/content from code
        makes the app easier to maintain, localize, and adapt to different devices.
      &lt;/p&gt;

      &lt;div class=&quot;res-table&quot;&gt;
        &lt;div class=&quot;res-card&quot;&gt;&lt;div class=&quot;res-name&quot;&gt;layout/&lt;/div&gt;&lt;p&gt;XML files defining each screen&#x27;s UI structure — Buttons, TextViews, and ViewGroups like LinearLayout or ConstraintLayout.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;res-card&quot;&gt;&lt;div class=&quot;res-name&quot;&gt;drawable/&lt;/div&gt;&lt;p&gt;Images, vector graphics, and custom shape/state drawables used for buttons, backgrounds, and icons.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;res-card&quot;&gt;&lt;div class=&quot;res-name&quot;&gt;values/&lt;/div&gt;&lt;p&gt;Reusable constants — strings.xml (text, supports localization), colors.xml (palette), styles.xml (theming), dimens.xml (spacing).&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;res-card&quot;&gt;&lt;div class=&quot;res-name&quot;&gt;mipmap/&lt;/div&gt;&lt;p&gt;Launcher icon in multiple densities (mdpi → xxxhdpi) so Android picks the right resolution per device.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;

      &lt;p class=&quot;lead&quot;&gt;
        Using resources instead of hardcoded values lets the app support multiple screen densities, enable
        localization (e.g. a &lt;span class=&quot;kw&quot;&gt;values-fr/&lt;/span&gt; folder), and keep a consistent design system.
        Here are this project&#x27;s actual resource files:

&amp;lt;&lt;span class=&quot;c-tag&quot;&gt;LinearLayout&lt;/span&gt; &lt;span class=&quot;c-attr&quot;&gt;xmlns:android&lt;/span&gt;=&lt;span class=&quot;c-str&quot;&gt;&quot;http://schemas.android.com/apk/res/android&quot;&lt;/span&gt;
    &lt;span class=&quot;c-attr&quot;&gt;android:layout_width&lt;/span&gt;=&lt;span class=&quot;c-str&quot;&gt;&quot;match_parent&quot;&lt;/span&gt;

    &lt;span class=&quot;c-attr&quot;&gt;android:orientation&lt;/span&gt;=&lt;span class=&quot;c-str&quot;&gt;&quot;vertical&quot;&lt;/span&gt;
    &lt;span class=&quot;c-attr&quot;&gt;android:gravity&lt;/span&gt;=&lt;span class=&quot;c-str&quot;&gt;&quot;center&quot;&lt;/span&gt;
    &lt;span class=&quot;c-attr&quot;&gt;android:padding&lt;/span&gt;=&lt;span class=&quot;c-str&quot;&gt;&quot;16dp&quot;&lt;/span&gt;&amp;gt;

    &amp;lt;&lt;span class=&quot;c-tag&quot;&gt;TextView&lt;/span&gt;
        &lt;span class=&quot;c-attr&quot;&gt;android:id&lt;/span&gt;=&lt;span class=&quot;c-str&quot;&gt;&quot;@+id/textViewMessage&quot;&lt;/span&gt;
        &lt;span class=&quot;c-attr&quot;&gt;android:layout_width&lt;/span&gt;=&lt;span class=&quot;c-str&quot;&gt;&quot;wrap_content&quot;&lt;/span&gt;

        &lt;span class=&quot;c-attr&quot;&gt;android:text&lt;/span&gt;=&lt;span class=&quot;c-str&quot;&gt;&quot;@string/welcome_message&quot;&lt;/span&gt;

    &amp;lt;&lt;span class=&quot;c-tag&quot;&gt;Button&lt;/span&gt;
        &lt;span class=&quot;c-attr&quot;&gt;android:id&lt;/span&gt;=&lt;span class=&quot;c-str&quot;&gt;&quot;@+id/buttonClickMe&quot;&lt;/span&gt;
        &lt;span class=&quot;c-attr&quot;&gt;android:layout_width&lt;/span&gt;=&lt;span class=&quot;c-str&quot;&gt;&quot;wrap_content&quot;&lt;/span&gt;
        &lt;span class=&quot;c-attr&quot;&gt;android:layout_height&lt;/span&gt;=&lt;span class=&quot;c-str&quot;&gt;&quot;wrap_content&quot;&lt;/span&gt;
        &lt;span class=&quot;c-attr&quot;&gt;android:text&lt;/span&gt;=&lt;span class=&quot;c-str&quot;&gt;&quot;@string/button_text&quot;&lt;/span&gt; /&amp;gt;

&amp;lt;/&lt;span class=&quot;c-tag&quot;&gt;LinearLayout&lt;/span&gt;&amp;gt;&lt;/pre&gt;
        &lt;/div&gt;
        &lt;div class=&quot;file-panel&quot;&gt;
          &lt;div class=&quot;file-path&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;res/values/colors.xml&lt;/div&gt;
          &lt;pre class=&quot;code-block&quot;&gt;&lt;span class=&quot;c-cm&quot;&gt;&amp;lt;?xml version=&quot;1.0&quot; encoding=&quot;utf-8&quot;?&amp;gt;&lt;/span&gt;
&amp;lt;&lt;span class=&quot;c-tag&quot;&gt;resources&lt;/span&gt;&amp;gt;
    &amp;lt;&lt;span class=&quot;c-tag&quot;&gt;color&lt;/span&gt; &lt;span class=&quot;c-attr&quot;&gt;name&lt;/span&gt;=&lt;span class=&quot;c-str&quot;&gt;&quot;colorPrimary&quot;&lt;/span&gt;&amp;gt;#6200EE&amp;lt;/&lt;span class=&quot;c-tag&quot;&gt;color&lt;/span&gt;&amp;gt;
    &amp;lt;&lt;span class=&quot;c-tag&quot;&gt;color&lt;/span&gt; &lt;span class=&quot;c-attr&quot;&gt;name&lt;/span&gt;=&lt;span class=&quot;c-str&quot;&gt;&quot;colorPrimaryDark&quot;&lt;/span&gt;&amp;gt;#3700B3&amp;lt;/&lt;span class=&quot;c-tag&quot;&gt;color&lt;/span&gt;&amp;gt;

&amp;lt;/&lt;span class=&quot;c-tag&quot;&gt;resources&lt;/span&gt;&amp;gt;&lt;/pre&gt;

        &lt;div class=&quot;file-panel&quot;&gt;
          &lt;div class=&quot;file-path&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;res/values/strings.xml&lt;/div&gt;

&amp;lt;&lt;span class=&quot;c-tag&quot;&gt;resources&lt;/span&gt;&amp;gt;
    &amp;lt;&lt;span class=&quot;c-tag&quot;&gt;string&lt;/span&gt; &lt;span class=&quot;c-attr&quot;&gt;name&lt;/span&gt;=&lt;span class=&quot;c-str&quot;&gt;&quot;app_name&quot;&lt;/span&gt;&amp;gt;Simple Android App&amp;lt;/&lt;span class=&quot;c-tag&quot;&gt;string&lt;/span&gt;&amp;gt;

    &amp;lt;&lt;span class=&quot;c-tag&quot;&gt;string&lt;/span&gt; &lt;span class=&quot;c-attr&quot;&gt;name&lt;/span&gt;=&lt;span class=&quot;c-str&quot;&gt;&quot;button_text&quot;&lt;/span&gt;&amp;gt;Click Me&amp;lt;/&lt;span class=&quot;c-tag&quot;&gt;string&lt;/span&gt;&amp;gt;

&amp;lt;/&lt;span class=&quot;c-tag&quot;&gt;resources&lt;/span&gt;&amp;gt;&lt;/pre&gt;
        &lt;/div&gt;
        &lt;div class=&quot;file-panel&quot;&gt;
          &lt;div class=&quot;file-path&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;res/values/styles.xml&lt;/div&gt;
          &lt;pre class=&quot;code-block&quot;&gt;&lt;span class=&quot;c-cm&quot;&gt;&amp;lt;?xml version=&quot;1.0&quot; encoding=&quot;utf-8&quot;?&amp;gt;&lt;/span&gt;
&amp;lt;&lt;span class=&quot;c-tag&quot;&gt;resources&lt;/span&gt;&amp;gt;
    &amp;lt;&lt;span class=&quot;c-tag&quot;&gt;style&lt;/span&gt; &lt;span class=&quot;c-attr&quot;&gt;name&lt;/span&gt;=&lt;span class=&quot;c-str&quot;&gt;&quot;AppTheme&quot;&lt;/span&gt; &lt;span class=&quot;c-attr&quot;&gt;parent&lt;/span&gt;=&lt;span class=&quot;c-str&quot;&gt;&quot;Theme.AppCompat.Light.DarkActionBar&quot;&lt;/span&gt;&amp;gt;
        &amp;lt;&lt;span class=&quot;c-tag&quot;&gt;item&lt;/span&gt; &lt;span class=&quot;c-attr&quot;&gt;name&lt;/span&gt;=&lt;span class=&quot;c-str&quot;&gt;&quot;colorPrimary&quot;&lt;/span&gt;&amp;gt;@color/colorPrimary&amp;lt;/&lt;span class=&quot;c-tag&quot;&gt;item&lt;/span&gt;&amp;gt;
        &amp;lt;&lt;span class=&quot;c-tag&quot;&gt;item&lt;/span&gt; &lt;span class=&quot;c-attr&quot;&gt;name&lt;/span&gt;=&lt;span class=&quot;c-str&quot;&gt;&quot;colorPrimaryDark&quot;&lt;/span&gt;&amp;gt;@color/colorPrimaryDark&amp;lt;/&lt;span class=&quot;c-tag&quot;&gt;item&lt;/span&gt;&amp;gt;
        &amp;lt;&lt;span class=&quot;c-tag&quot;&gt;item&lt;/span&gt; &lt;span class=&quot;c-attr&quot;&gt;name&lt;/span&gt;=&lt;span class=&quot;c-str&quot;&gt;&quot;colorAccent&quot;&lt;/span&gt;&amp;gt;@color/colorAccent&amp;lt;/&lt;span class=&quot;c-tag&quot;&gt;item&lt;/span&gt;&amp;gt;
    &amp;lt;/&lt;span class=&quot;c-tag&quot;&gt;style&lt;/span&gt;&amp;gt;
&amp;lt;/&lt;span class=&quot;c-tag&quot;&gt;resources&lt;/span&gt;&amp;gt;&lt;/pre&gt;

      &lt;div class=&quot;logic-note&quot;&gt;
        &lt;span class=&quot;ico&quot;&gt;&amp;gt;_&lt;/span&gt;
        &lt;span&gt;&lt;strong&gt;mipmap/README.txt:&lt;/strong&gt; this folder normally holds the app launcher icon
        (ic_launcher.png / ic_launcher.webp) in multiple densities: mipmap-mdpi, mipmap-hdpi, mipmap-xhdpi,
        mipmap-xxhdpi, mipmap-xxxhdpi. In Android Studio, right-click &lt;span class=&quot;kw&quot;&gt;res &amp;gt; New &amp;gt; Image Asset&lt;/span&gt;
        to auto-generate these icon files.&lt;/span&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- 05 CONCLUSION --&gt;
    &lt;section class=&quot;card&quot;&gt;
      &lt;div class=&quot;section-head&quot;&gt;
        &lt;div class=&quot;section-num&quot;&gt;05&lt;/div&gt;
        &lt;h2&gt;Conclusion&lt;/h2&gt;
      &lt;/div&gt;
      &lt;div class=&quot;conclusion&quot;&gt;
        &lt;p&gt;
          A simple Android project is built on three interdependent pillars: the &lt;strong&gt;AndroidManifest.xml&lt;/strong&gt;,
          which registers the app&#x27;s identity, components, and permissions with the operating system; the
          &lt;strong&gt;source files&lt;/strong&gt;, which contain the executable logic written in Java or Kotlin; and the
          &lt;strong&gt;resource (res) files&lt;/strong&gt;, which house all UI layouts, images, and constant values separately
          from code logic. This separation of concerns — configuration, logic, and presentation — is a core design
          principle of the Android framework, allowing for scalable, maintainable, and adaptable application development.
        &lt;/p&gt;
      &lt;/div&gt;
    &lt;/section&gt;

      &lt;article class=&quot;concept&quot;&gt;
        &lt;h3&gt;Concept 1: &lt;span class=&quot;kw&quot;&gt;val&lt;/span&gt; vs &lt;span class=&quot;kw&quot;&gt;var&lt;/span&gt;&lt;/h3&gt;
        &lt;p&gt;
          &lt;span class=&quot;kw&quot;&gt;val&lt;/span&gt; declares a &lt;strong&gt;read-only reference&lt;/strong&gt; — once a value is assigned,
          it cannot be reassigned to something else. It&#x27;s Kotlin&#x27;s way of enforcing immutability wherever a value
          shouldn&#x27;t change during the program&#x27;s lifetime.
        &lt;/p&gt;
        &lt;p&gt;
          &lt;span class=&quot;kw&quot;&gt;var&lt;/span&gt; declares a &lt;strong&gt;mutable variable&lt;/strong&gt; that can be reassigned as the
          program runs. This is what you reach for when a value is expected to change in response to events —
          like a counter, a score, or a login attempt tally.
        &lt;/p&gt;
        &lt;pre class=&quot;code-block&quot;&gt;&lt;span class=&quot;c-kw&quot;&gt;val&lt;/span&gt; maxAttempts = &lt;span class=&quot;c-str&quot;&gt;3&lt;/span&gt;      &lt;span class=&quot;c-cm&quot;&gt;// fixed — never changes&lt;/span&gt;
&lt;span class=&quot;c-kw&quot;&gt;var&lt;/span&gt; attemptCount = &lt;span class=&quot;c-str&quot;&gt;0&lt;/span&gt;      &lt;span class=&quot;c-cm&quot;&gt;// mutable — updates over time&lt;/span&gt;&lt;/pre&gt;
      &lt;/article&gt;

      &lt;article class=&quot;concept&quot;&gt;
        &lt;h3&gt;Concept 2: Conditional Logic in an Android Login Screen&lt;/h3&gt;
        &lt;p&gt;
          In a login screen, you&#x27;d use a &lt;span class=&quot;kw&quot;&gt;var&lt;/span&gt; for &lt;code&gt;attemptCount&lt;/code&gt; — since it needs
          to increment every time a login fails — paired with an &lt;span class=&quot;kw&quot;&gt;if/else&lt;/span&gt; statement to decide
          the outcome:
        &lt;/p&gt;
        &lt;pre class=&quot;code-block&quot;&gt;&lt;span class=&quot;c-kw&quot;&gt;if&lt;/span&gt; (password == storedPassword) {
    &lt;span class=&quot;c-fn&quot;&gt;grantAccess&lt;/span&gt;()
} &lt;span class=&quot;c-kw&quot;&gt;else&lt;/span&gt; {
    &lt;span class=&quot;c-var&quot;&gt;attemptCount&lt;/span&gt;++
    &lt;span class=&quot;c-fn&quot;&gt;showError&lt;/span&gt;()
}&lt;/pre&gt;
        &lt;div class=&quot;logic-note&quot;&gt;
          &lt;span class=&quot;ico&quot;&gt;&amp;gt;_&lt;/span&gt;
          &lt;span&gt;The conditional statement is what lets the app decide the outcome based on changing input —
          creating the necessary branching logic that separates &quot;correct password&quot; from &quot;wrong password&quot; paths.&lt;/span&gt;
        &lt;/div&gt;
      &lt;/article&gt;

&lt;script&gt;
  // ---- Kotlin-equivalent logic, expressed in JS ----
  const storedPassword = &quot;rog2026&quot;;   // acts like Kotlin&#x27;s `val` — never reassigned
  let attemptCount = 0;               // acts like Kotlin&#x27;s `var` — mutates over time
  const maxAttempts = 5;              // val — lockout threshold
  let locked = false;

  const passwordInput = document.getElementById(&#x27;password&#x27;);
  const usernameInput = document.getElementById(&#x27;username&#x27;);
  const loginBtn = document.getElementById(&#x27;loginBtn&#x27;);
  const resetBtn = document.getElementById(&#x27;resetBtn&#x27;);
  const statusMsg = document.getElementById(&#x27;statusMsg&#x27;);
  const counterEl = document.getElementById(&#x27;attemptCount&#x27;);
  const logBox = document.getElementById(&#x27;logBox&#x27;);

  function addLog(text, cls){
    const line = document.createElement(&#x27;div&#x27;);
    line.className = &#x27;log-line &#x27; + (cls || &#x27;&#x27;);
    line.textContent = text;
    logBox.appendChild(line);
    logBox.scrollTop = logBox.scrollHeight;
  }

  function bumpCounter(){
    counterEl.textContent = attemptCount;
    counterEl.classList.remove(&#x27;bump&#x27;);
    void counterEl.offsetWidth; // restart animation
    counterEl.classList.add(&#x27;bump&#x27;);
  }

  function grantAccess(){
    statusMsg.className = &#x27;ok&#x27;;
    statusMsg.textContent = &#x27;✅ Access granted — password == storedPassword. Welcome, &#x27; + (usernameInput.value || &#x27;user&#x27;) + &#x27;.&#x27;;
    addLog(&#x27;if (password == storedPassword) → true → grantAccess()&#x27;, &#x27;g&#x27;);
    loginBtn.disabled = true;
    loginBtn.style.opacity = &#x27;0.6&#x27;;
    loginBtn.textContent = &#x27;Access Granted&#x27;;
  }

  function showError(){
    attemptCount++;                 // var mutation, mirrors attemptCount++ in Kotlin
    bumpCounter();
    addLog(&#x27;else → attemptCount++ → showError()  [attemptCount = &#x27; + attemptCount + &#x27;]&#x27;, &#x27;r&#x27;);

    if (attemptCount &gt;= maxAttempts){
      locked = true;
      statusMsg.className = &#x27;lock&#x27;;
      statusMsg.textContent = &#x27;🔒 Too many failed attempts (&#x27; + attemptCount + &#x27;/&#x27; + maxAttempts + &#x27;). Login locked.&#x27;;
      addLog(&#x27;attemptCount &gt;= maxAttempts → account locked&#x27;, &#x27;y&#x27;);
      loginBtn.disabled = true;
      loginBtn.style.opacity = &#x27;0.5&#x27;;
    } else {
      statusMsg.className = &#x27;err&#x27;;
      statusMsg.textContent = &#x27;❌ Wrong password. Attempt &#x27; + attemptCount + &#x27; of &#x27; + maxAttempts + &#x27;.&#x27;;
    }
  }

  loginBtn.addEventListener(&#x27;click&#x27;, () =&gt; {
    if (locked) return;
    const entered = passwordInput.value;

    if (entered.trim() === &quot;&quot;){
      statusMsg.className = &#x27;err&#x27;;
      statusMsg.textContent = &#x27;⚠️ Please enter a password to test the logic.&#x27;;
      return;
    }

    // This mirrors the exact Kotlin if/else from the assignment:
    if (entered === storedPassword) {
      grantAccess();
    } else {
      showError();
    }
  });

  passwordInput.addEventListener(&#x27;keyup&#x27;, (e) =&gt; {
    if (e.key === &#x27;Enter&#x27;) loginBtn.click();
  });

  resetBtn.addEventListener(&#x27;click&#x27;, () =&gt; {
    attemptCount = 0;
    locked = false;
    passwordInput.value = &#x27;&#x27;;
    bumpCounter();
    statusMsg.className = &#x27;&#x27;;
    statusMsg.textContent = &#x27;&#x27;;
    statusMsg.style.display = &#x27;none&#x27;;
    loginBtn.disabled = false;
    loginBtn.style.opacity = &#x27;1&#x27;;
    loginBtn.textContent = &#x27;Attempt Login&#x27;;
    logBox.innerHTML = &#x27;&#x27;;
    addLog(&#x27;// session reset — attemptCount reinitialized to 0&#x27;, &#x27;y&#x27;);
  });
&lt;/script&gt;
